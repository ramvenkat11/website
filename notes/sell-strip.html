<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentence to run: mockup</title>
<link rel="stylesheet" href="../html/styles/styles.css">
<style>
.mk { padding: 56px 0; }
.mk .section-head { margin-bottom: 36px; }
.mk .section-head h2 { font-size: 24px; }
.mk-theme { position: fixed; right: 14px; bottom: 14px; z-index: 9; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--ink); font: 600 12px var(--font); cursor: pointer; }

.ss { display: grid; grid-template-columns: minmax(0, .9fr) 96px minmax(0, 1.3fr) 96px minmax(0, .9fr); align-items: center; gap: 0 10px; max-width: 1020px; margin: 0 auto; }
.ss-step { display: grid; gap: 10px; align-self: center; }
.ss-h { display: block; color: var(--muted); font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; text-align: center; }
.ss-card { border: 1px solid var(--line); border-radius: 16px; background: var(--card); box-shadow: var(--card-shadow); }

.ss-say { padding: 18px 18px 20px; display: grid; gap: 12px; justify-items: end; }
.ss-bubble { max-width: 100%; padding: 10px 14px; border-radius: 14px 14px 4px 14px; background: var(--bubble-bg); color: #eef2f9; font-size: 14px; line-height: 1.45; }

.ss-arr { display: grid; justify-items: center; align-content: center; gap: 7px; }
.ss-arr b { padding: 4px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--ink); font-size: 11.5px; font-weight: 650; white-space: nowrap; }
.ss-arr b a { color: inherit; }
.ss-arr b a:hover { color: var(--blue-ink); }
.ss-arr i { position: relative; display: block; width: 100%; height: 2px; background: var(--line); }
.ss-arr i::after { content: ""; position: absolute; right: -1px; top: -4px; width: 8px; height: 8px; border-top: 2px solid var(--line); border-right: 2px solid var(--line); transform: rotate(45deg); }

.ss-agent .bar { padding: 8px 12px; }
.ss-agent .bar .fname { font-size: 11.5px; }
.ss-agent pre { padding: 12px 14px; font-size: 10.5px; line-height: 1.55; }
.ss-agent .ex { color: #f0c674; }
.ss-fmt { display: block; color: var(--muted); font-size: 12.5px; text-align: center; }
.ss-fmt a { color: var(--blue-ink); font-weight: 600; }

.ss-run { padding: 8px 16px 10px; }
.ss-run dl { margin: 0; }
.ss-run div { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line-soft); }
.ss-run div:first-child { border-top: 0; }
.ss-run dt { margin: 0; color: var(--ink); font-size: 13px; font-weight: 600; white-space: nowrap; }
.ss-run dt a { color: inherit; }
.ss-run dt a:hover { color: var(--blue-ink); }
.ss-run dd { margin: 0; color: var(--muted); font-family: var(--mono); font-size: 11.5px; white-space: nowrap; }
.ss-run dd.ok { color: var(--ok); font-family: var(--font); font-weight: 700; }

@media (max-width: 899px) {
  .ss { grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 12px; }
  .ss-step { width: min(100%, 360px); }
  .ss-arr { width: 100%; }
  .ss-arr i { width: 2px; height: 26px; }
  .ss-arr i::after { right: auto; top: auto; left: -3px; bottom: -1px; transform: rotate(135deg); }
}
@media (max-width: 360px) {
  .ss-agent pre { font-size: 10px; }
}
</style>
</head>
<body>
<button class="mk-theme" type="button">Theme</button>

<section class="section soft mk" id="opt">
  <div class="container">
    <div class="section-head center">
      <h2>Agents as dependable as code, yet as easy to create as a&nbsp;prompt</h2>
      <p>A sentence becomes an agent in JSON with Python expressions. The agent server validates it, then guards and records every&nbsp;run.</p>
    </div>
    <figure class="ss" aria-label="A sentence, Answer questions from the docs site, is drafted with AI into a Search2o agent, ask_the_docs.json, with three steps: api, llm, output. The agent is validated and published. Every run is validated, allowlisted, limited in time and cost, keyed from the vault, and written to the audit log.">
      <div class="ss-step">
        <span class="ss-h">Describe</span>
        <div class="ss-card ss-say">
          <div class="ss-bubble">Answer questions from the docs&nbsp;site.</div>
        </div>
      </div>
      <div class="ss-arr"><b><a href="../html/docs/development/draft-with-ai.html">Draft with AI</a></b><i></i></div>
      <div class="ss-step">
        <span class="ss-h">The agent</span>
        <div class="codecard ss-agent">
          <div class="bar"><span class="d"></span><span class="d"></span><span class="d"></span><span class="fname">ask_the_docs.json</span></div>
          <pre><code>{
  <span class=key>"functions"</span>: {
    <span class=key>"main"</span>: {
      <span class=key>"commands"</span>: {
        <span class=key>"api"</span>: {
          <span class=key>"profile"</span>: <span class=str>"docs"</span>,
          <span class=key>"path"</span>: <span class=str>"/search"</span>,
          <span class=key>"queryParams"</span>: {
            <span class=key>"q"</span>: <span class=str>"<span class=ex>{ sys.query }</span>"</span>
          }
        },
        <span class=key>"llm"</span>: {
          <span class=key>"profile"</span>: <span class=str>"gpt5_mini"</span>,
          <span class=key>"prompt"</span>: <span class=str>"answer"</span>
        },
        <span class=key>"output"</span>: <span class=str>"<span class=ex>{ result }</span>"</span>
      }
    }
  }
}</code></pre>
        </div>
        <span class="ss-fmt"><a href="../html/docs/agent-definition/syntax.html">JSON with Python expressions</a></span>
      </div>
      <div class="ss-arr"><b><a href="../html/docs/development/trace-and-validation.html">Validate, publish</a></b><i></i></div>
      <div class="ss-step">
        <span class="ss-h">Every run</span>
        <div class="ss-card ss-run">
          <dl>
            <div><dt><a href="../html/docs/development/trace-and-validation.html">Validated</a></dt><dd class="ok">&#10003;</dd></div>
            <div><dt><a href="../html/docs/runtime/allowlist.html">Allowlist</a></dt><dd>docs API</dd></div>
            <div><dt><a href="../html/docs/security/secret-vault.html">API key</a></dt><dd>from the vault</dd></div>
            <div><dt><a href="../html/docs/runtime/runtime-limits.html">Time</a></dt><dd>1.8 s of 30 s</dd></div>
            <div><dt><a href="../html/docs/reports/cost.html">Cost</a></dt><dd>$0.003 of $0.05</dd></div>
            <div><dt><a href="../html/runtime.html#leaves">Audit log</a></dt><dd>run 4812</dd></div>
          </dl>
        </div>
      </div>
    </figure>
  </div>
</section>

<script>
document.querySelector(".mk-theme").addEventListener("click", function () {
  var r = document.documentElement;
  r.setAttribute("data-theme", r.getAttribute("data-theme") === "dark" ? "light" : "dark");
});
</script>
</body>
</html>
