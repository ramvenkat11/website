<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign up</title>
<script src="https://js.hcaptcha.com/1/api.js" async defer></script>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         max-width: 460px; margin: 3rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; margin-bottom: 1.25rem; }
  label { display: block; margin-top: 1rem; font-weight: 500; }
  input[type=text], input[type=email], input[type=password] {
    width: 100%; padding: .5rem; margin-top: .25rem; border: 1px solid #8886;
    border-radius: 6px; background: transparent; color: inherit; font: inherit; }
  .hint { font-size: .82rem; opacity: .65; margin-top: .2rem; }
  .row { display: flex; gap: .5rem; align-items: center; margin-top: 1rem; }
  button { margin-top: 1.25rem; padding: .55rem 1.2rem; border-radius: 6px; border: 1px solid #8886;
           background: #2563eb; color: #fff; font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #out { margin-top: 1.25rem; padding: .75rem; border-radius: 6px; font-size: .9rem; display: none; }
  .ok { background: #16a34a22; border: 1px solid #16a34a66; }
  .err { background: #dc262622; border: 1px solid #dc262666; }
  .key { font-family: ui-monospace, Menlo, monospace; user-select: all; background: #8882;
         padding: .35rem .5rem; border-radius: 4px; display: inline-block; margin-top: .5rem; }
  #step2 { display: none; }
</style>
</head>
<body>

<h1>Sign up</h1>

<div id="step1">
  <label>Work email
    <input type="email" id="email" autocomplete="email">
  </label>

  <label>Your name
    <input type="text" id="userName" autocomplete="name">
  </label>

  <label>Account name
    <input type="text" id="accountName">
  </label>

  <label>Password
    <input type="password" id="password" autocomplete="new-password">
    <span class="hint">8&ndash;16 characters, with an upper case letter, a lower case letter,
      a digit and a symbol.</span>
  </label>

  <div class="row">
    <input type="checkbox" id="terms">
    <label for="terms" style="margin:0;font-weight:400">I accept the Terms of Service</label>
  </div>

  <div class="h-captcha" style="margin-top:1.25rem"
       data-sitekey="ff281746-715c-41a8-a28e-83d42d90b0da"></div>

  <button id="go1">Continue</button>
</div>

<div id="step2">
  <p>We sent a code to <span id="sentTo"></span>.</p>
  <label>Code
    <input type="text" id="code" autocomplete="one-time-code">
  </label>
  <button id="go2">Create account</button>
</div>

<div id="out"></div>

<script>
const BASE = 'https://api.search2o.com';
const $ = id => document.getElementById(id);
let lookup = '';

function say(msg, ok) {
  const o = $('out');
  o.style.display = 'block';
  o.className = ok ? 'ok' : 'err';
  o.innerHTML = msg;
}

async function post(path, body) {
  const r = await fetch(BASE + path, {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
  });
  let data = null;
  try { data = await r.json(); } catch (e) {}
  return data;
}

$('go1').onclick = async () => {
  const email = $('email').value.trim(), password = $('password').value;
  const userName = $('userName').value.trim(), accountName = $('accountName').value.trim();
  if (!email || !password || !userName || !accountName) return say('Please fill in every field.', false);
  if (!$('terms').checked) return say('Please accept the Terms of Service.', false);

  let token = '';
  try { token = hcaptcha.getResponse(); } catch (e) {}
  if (!token) return say('Please complete the hCaptcha.', false);

  $('go1').disabled = true;
  try {
    const data = await post('/reg1', {email, password, userName, accountName, terms: true, token});
    if (data && data.success) {
      lookup = data.lookup;
      $('sentTo').textContent = email;
      $('step1').style.display = 'none';
      $('step2').style.display = 'block';
      say('', true);
      $('out').style.display = 'none';
    } else {
      say('We could not complete your registration. Please check your details and try again.', false);
    }
  } catch (e) {
    say('Something went wrong. Please try again.', false);
  } finally {
    $('go1').disabled = false;
    try { hcaptcha.reset(); } catch (e) {}
  }
};

$('go2').onclick = async () => {
  const code = $('code').value.trim();
  if (!code) return say('Please enter the code.', false);
  $('go2').disabled = true;
  try {
    const data = await post('/reg2', {lookup, code});
    if (data && data.success && data.license) {
      $('step2').style.display = 'none';
      say('Your account is ready. This is your key &mdash; store it now, it is shown only once.'
          + '<div class="key">' + data.license + '</div>', true);
    } else {
      say('That code did not work. It may have expired.', false);
    }
  } catch (e) {
    say('Something went wrong. Please try again.', false);
  } finally { $('go2').disabled = false; }
};
</script>
</body>
</html>
